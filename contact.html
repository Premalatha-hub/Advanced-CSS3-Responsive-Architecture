<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Ravish for web development opportunities, collaborations, and inquiries.">
    <meta name="author" content="Ravish">
    <title>Contact - Ravish Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header role="banner" class="glass-header">
        <div class="header-container">
            <div class="brand">Ravish.</div>
            <nav aria-label="Primary navigation" role="navigation">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
            <button id="theme-toggle" aria-label="Toggle dark mode" class="icon-btn">
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </header>
    
    <main id="main-content" role="main" class="container page-section animate-slide-up">
        <section aria-labelledby="contact-heading" class="contact-section">
            <div class="contact-info">
                <h1 id="contact-heading" class="gradient-text">Get in Touch</h1>
                <p>I would love to hear from you. Whether it's a project, a job opportunity, or just a chat.</p>
                
                <div class="contact-methods">
                    <div class="method-card glass-card">
                        <h3>Email</h3>
                        <p>hello@example.com</p>
                    </div>
                    <div class="method-card glass-card">
                        <h3>Location</h3>
                        <p>San Francisco, CA</p>
                    </div>
                </div>
            </div>
            
            <div class="contact-form-wrapper glass-card">
                <form action="#" method="POST" aria-label="Contact form" class="modern-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Full Name <span aria-hidden="true" class="required">*</span><span class="sr-only">Required</span></label>
                            <input type="text" id="name" name="name" required aria-required="true" autocomplete="name" placeholder="John Doe">
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email Address <span aria-hidden="true" class="required">*</span><span class="sr-only">Required</span></label>
                            <input type="email" id="email" name="email" required aria-required="true" autocomplete="email" placeholder="john@example.com">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" placeholder="What is this regarding?">
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Your Message <span aria-hidden="true" class="required">*</span><span class="sr-only">Required</span></label>
                        <textarea id="message" name="message" rows="5" required aria-required="true" placeholder="Hello, I'd like to talk about..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary full-width">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer role="contentinfo" class="site-footer">
        <div class="container footer-content">
            <p>&copy; <span id="current-year">2026</span> Ravish. All rights reserved.</p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
